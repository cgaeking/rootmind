# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

PackageIdentifier: cgaeking.RootMind
PackageVersion: ${VERSION}
InstallerLocale: en-US
InstallerType: nullsoft
Scope: machine
ElevationRequirement: elevatesSelf
InstallModes:
- interactive
- silent
- silentWithProgress
UpgradeBehavior: install
ProductCode: RootMind
ReleaseDate: ${RELEASE_DATE}
AppsAndFeaturesEntries:
- DisplayName: RootMind
  Publisher: ${PUBLISHER}
  ProductCode: RootMind
InstallationMetadata:
  DefaultInstallLocation: '%ProgramFiles%\RootMind'
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/cgaeking/rootmind/releases/download/v${VERSION}/RootMind-Setup-x64.exe
  InstallerSha256: ${INSTALLER_SHA256}
ManifestType: installer
ManifestVersion: 1.12.0
