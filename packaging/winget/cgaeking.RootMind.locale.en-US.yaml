ShortDescription: Search your local documents and ask questions about them, with sources.
Description: |-
  RootMind indexes the folders you choose into a local SQLite full-text index. When you ask a
  question, a language model of your choice (Anthropic, OpenAI or xAI) decides what to search for
  and which documents to read, and answers with sources down to the page, slide or sheet. Search
  and indexing work offline without an API key. The same read-only tools are available to other
  agents over MCP.
