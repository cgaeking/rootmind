name: release

# Builds and checks everything a release ships, and publishes it for a
# version tag:
#
#   meta       versions agree (and match the tag); the tag has release notes;
#              the NSIS template is the one for the locked Tauri CLI
#   backend    backend-exe.yml: onedir builds (Windows, Linux), smoke tests,
#              service end-to-end tests (Windows services, systemd user units)
#   installer  the per-machine NSIS installer with exactly that backend, a
#              check that it updates an installed version in place, and the
#              installer smoke test (install with the Windows services,
#              update, reinstall, uninstall) on the elevated runner
#   linux-packages  .deb, .rpm and AppImage with the Linux backend; the .deb
#              installs on the runner and both backends report the version
#   winget     the winget manifests, rendered and validated against the schemas
#   mcpb       rootmind.mcpb for Claude Desktop: the bridge's tests, then the
#              bundle validated and packed with the mcpb CLI
#   publish    tags only: backend archives, checksums, attestations, GitHub Release
#   mcp-registry  server.json for the MCP Registry, rendered from the bundle
#              and validated; after a release (not a prerelease) published
#              with mcp-publisher, without a stored secret (GitHub OIDC)
#
# A manual run (workflow_dispatch) and pull requests that change the packaging
# are dry runs: the same builds and checks, nothing is published. Every run
# builds from scratch without caches, so a dry run rehearses the tag build.
# The binaries are not code-signed yet; signing jobs would go between backend
# and installer, and between installer and publish.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/src-tauri/tauri.conf.json"
      - "desktop/src-tauri/tauri.linux.conf.json"
      - "desktop/src-tauri/tauri.release.conf.json"
      - "desktop/src-tauri/installer/**"
      # The Tauri CLI locked here builds the installer.
      - "desktop/pnpm-lock.yaml"
      - "desktop/scripts/**"
      - "backend/packaging/**"
      - "packaging/winget/**"
      - "packaging/mcpb/**"
      - "scripts/check_versions.py"
      - "scripts/nsis_template.py"
      - "scripts/prepare_backend.py"
      - "scripts/registry_server_json.py"
      - "scripts/release_notes.py"
      - "scripts/winget_manifests.py"
      - ".github/workflows/release.yml"
      # The backend job; this workflow uses its artifact name and outputs.
      - ".github/workflows/backend-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No job has an API key. The base URLs point at a closed local port, so even a
# request that bypassed the checks could not reach a provider.
env:
  ANTHROPIC_BASE_URL: "http://127.0.0.1:9"
  OPENAI_BASE_URL: "http://127.0.0.1:9"
  # The mcpb CLI that packs rootmind.mcpb; mcpb.yml uses the same version.
  MCPB_CLI: "@anthropic-ai/mcpb@2.1.2"

jobs:
  meta:
    name: Version and release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # backend/pyproject.toml, desktop/package.json and Cargo.toml carry the
      # same version (PEP 440 normal form), and a tag names it, spelled as in
      # package.json (v1.2.0-rc.1, not v1.2.0rc1): the installer's download
      # URL in the winget manifest uses that spelling.
      - name: Versions
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version desktop/package.json)
          if [ "$REF_TYPE" = tag ]; then
            python3 scripts/check_versions.py --tag "$REF_NAME"
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::The tag must be v$version, spelled as in desktop/package.json."
              exit 1
            fi
          else
            python3 scripts/check_versions.py
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Version $version (prerelease: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

      # A tag without a CHANGELOG.md section fails here, before the long
      # builds. Dry runs only preview the notes.
      - name: Release notes
        env:
          REF_TYPE: ${{ github.ref_type }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if python3 scripts/release_notes.py "v$VERSION" > "$RUNNER_TEMP/notes.md"; then
            { echo "### Release notes"; echo; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$REF_TYPE" = tag ]; then
            exit 1
          else
            echo "::notice::CHANGELOG.md has no section for $VERSION; a tag would fail here."
          fi

      # desktop/src-tauri/installer/installer.nsi is Tauri's NSIS template
      # for the locked @tauri-apps/cli with RootMind's changes (no reinstall
      # page). Downloads the upstream template from the Tauri repository.
      - name: NSIS template
        run: python3 scripts/nsis_template.py --check

  backend:
    name: Backend
    needs: meta
    # A local reusable workflow runs from the same commit as this workflow.
    # The newer "$/" form is not understood by actionlint yet.
    uses: ./.github/workflows/backend-exe.yml # zizmor: ignore[self-repository]
    with:
      use-cache: false

  installer:
    name: Installer
    needs: [meta, backend]
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency caches in this job: a release build never restores a
      # cache written by another run.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json # pnpm version from "packageManager"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # The pinned compiler that desktop.yml tests with (RUST_TOOLCHAIN there).
      - name: Rust toolchain
        env:
          RUST_TOOLCHAIN: "1.96.0"
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootmind-backend-windows-x64
          path: ${{ runner.temp }}/rootmind-backend

      # Copies the tested build into desktop/src-tauri/binaries/ and checks
      # its tree hash against the one backend-exe.yml reported, its size and
      # --version.
      - name: Place the backend
        env:
          TREE_SHA256: ${{ needs.backend.outputs.tree-sha256 }}
        run: >-
          python scripts/prepare_backend.py
          --from (Join-Path $env:RUNNER_TEMP "rootmind-backend")
          --expect-tree-sha256 $env:TREE_SHA256

      - name: Install dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # tauri build runs cargo without --locked: fail here instead if
      # Cargo.lock does not match Cargo.toml, so the release builds exactly
      # the crates CI tested.
      - name: Check Cargo.lock
        working-directory: desktop/src-tauri
        run: cargo fetch --locked

      # Runs `pnpm build` first (beforeBuildCommand), then the release build
      # and the NSIS bundle. The overlay adds the backend as resources.
      - name: Build the installer
        working-directory: desktop
        run: |
          "Toolchain: $(rustc -V), node $(node -v), pnpm $(pnpm -v)" >> $env:GITHUB_STEP_SUMMARY
          pnpm tauri build --ci --config src-tauri/tauri.release.conf.json

      # The script Tauri rendered from installer/installer.nsi. An installed
      # version must be updated in place without questions: no reinstall page
      # ("already installed, uninstall it first?"). There is no folder page:
      # the installer is per machine, always installs into Program Files and
      # sets up the Windows service from there (the hooks refuse another
      # folder). /S never shows pages, so the smoke test below cannot see a
      # page; this check can.
      - name: Check the installer script
        run: |
          $nsi = "desktop/src-tauri/target/release/nsis/x64/installer.nsi"
          if (-not (Test-Path -LiteralPath $nsi -PathType Leaf)) { throw "$nsi not found" }
          $page = @(Select-String -LiteralPath $nsi -Pattern 'PageReinstall|Page custom|ReinstallPageCheck|MUI_PAGE_DIRECTORY')
          if ($page.Count) {
            $page | ForEach-Object { "::error::installer.nsi line $($_.LineNumber): $($_.Line.Trim())" }
            throw "the installer has a reinstall page or a folder page"
          }
          $required = @(
            '^!define INSTALLMODE "perMachine"$',
            '^!include ".*\\installer\\hooks\.nsh"$'
          )
          foreach ($pattern in $required) {
            if (-not (Select-String -LiteralPath $nsi -Pattern $pattern -Quiet)) { throw "installer.nsi has no line matching $pattern" }
          }
          "Installer script: per machine, no reinstall page, no folder page" >> $env:GITHUB_STEP_SUMMARY

      # GitHub's Windows runners are elevated and set CI=true, which the
      # script requires: it installs RootMind and its Windows services.
      - name: Installer smoke test
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          BACKEND_VERSION: ${{ needs.backend.outputs.version }}
          TREE_SHA256: ${{ needs.backend.outputs.tree-sha256 }}
        run: |
          $setup = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*_x64-setup.exe)
          if ($setup.Count -ne 1) { throw "expected one NSIS installer, found $($setup.Count)" }
          $conf = Get-Content desktop/src-tauri/tauri.conf.json -Raw -Encoding utf8 | ConvertFrom-Json
          ./desktop/scripts/installer-smoke.ps1 -Setup $setup[0].FullName -Version $env:VERSION `
            -BackendVersion $env:BACKEND_VERSION -BackendTreeSha256 $env:TREE_SHA256 `
            -Publisher $conf.bundle.publisher -Identifier $conf.identifier `
            -WorkDir (Join-Path $env:RUNNER_TEMP "installer-smoke")

      - name: Release asset
        run: |
          $setup = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*_x64-setup.exe)[0]
          $dir = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "installer")
          $asset = Join-Path $dir "RootMind-Setup-x64.exe"
          Copy-Item -LiteralPath $setup.FullName -Destination $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $asset).Length
          ("Installer: RootMind-Setup-x64.exe, {0:N1} MB, SHA-256 {1}" -f ($size / 1MB), $hash) >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rootmind-installer-windows-x64
          path: ${{ runner.temp }}/installer/RootMind-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30

  linux-packages:
    name: Linux packages
    needs: [meta, backend]
    # The oldest supported glibc, like the backend build.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tauri's Linux prerequisites (WebKitGTK 4.1). No dependency caches: a
      # release build never restores a cache written by another run.
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json # pnpm version from "packageManager"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # The pinned compiler that desktop.yml tests with (RUST_TOOLCHAIN there).
      - name: Rust toolchain
        env:
          RUST_TOOLCHAIN: "1.96.0"
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootmind-backend-linux-x64
          path: ${{ runner.temp }}/linux-backend

      # The scripts need Python 3.11+ (tomllib); ubuntu-22.04 ships 3.10.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      # The tested Linux build, checked against the tree hash backend-exe.yml
      # reported, its size and --version (scripts/prepare_backend.py).
      - name: Place the backend
        env:
          TREE_SHA256: ${{ needs.backend.outputs.linux-tree-sha256 }}
        run: |
          tar -xzf "$RUNNER_TEMP/linux-backend/rootmind-backend-linux-x64.tar.gz" -C "$RUNNER_TEMP/linux-backend"
          uv run --no-project --python 3.12 python scripts/prepare_backend.py --from "$RUNNER_TEMP/linux-backend/rootmind-backend" \
            --expect-tree-sha256 "$TREE_SHA256"

      - name: Install dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Check Cargo.lock
        working-directory: desktop/src-tauri
        run: cargo fetch --locked

      # tauri.linux.conf.json (merged on Linux) selects .deb, .rpm and the
      # AppImage; the release overlay adds the backend as resources.
      - name: Build the packages
        working-directory: desktop
        run: |
          echo "Toolchain: $(rustc -V), node $(node -v), pnpm $(pnpm -v)" >> "$GITHUB_STEP_SUMMARY"
          pnpm tauri build --ci --config src-tauri/tauri.release.conf.json

      # Stable names, so the README can link to the latest release.
      - name: Release assets
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          bundle=desktop/src-tauri/target/release/bundle
          out="$RUNNER_TEMP/linux-packages"
          mkdir -p "$out"
          for pattern in "deb/*.deb" "rpm/*.rpm" "appimage/*.AppImage"; do
            # shellcheck disable=SC2086 # the pattern is meant to expand
            set -- $bundle/$pattern
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "::error::expected one file for $pattern, found $#"
              exit 1
            fi
          done
          cp "$bundle"/deb/*.deb "$out/RootMind-amd64.deb"
          cp "$bundle"/rpm/*.rpm "$out/RootMind-x86_64.rpm"
          cp "$bundle"/appimage/*.AppImage "$out/RootMind-x86_64.AppImage"
          chmod +x "$out/RootMind-x86_64.AppImage"
          for file in "$out"/*; do
            echo "$(basename "$file"): $(du -m "$file" | cut -f1) MB, SHA-256 $(sha256sum "$file" | cut -d ' ' -f 1)" >> "$GITHUB_STEP_SUMMARY"
          done

      # The packages hold the backend and start it: the .deb installs on this
      # runner, its backend reports the release version, and the AppImage's
      # backend (which linuxdeploy rewrites) runs from the image.
      - name: Check the packages
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          out="$RUNNER_TEMP/linux-packages"
          dpkg-deb -I "$out/RootMind-amd64.deb"
          log="$RUNNER_TEMP/deb-install.log"
          sudo apt-get install -y -q "$out/RootMind-amd64.deb" > "$log" 2>&1 || { cat "$log"; exit 1; }
          cat "$log"
          # The package's postinst tells the user how to start the app.
          if ! tr -d '\r' < "$log" | grep -Eq '^[[:space:]]+rootmind-desktop[[:space:]]*$'; then
            grep -n "rootmind-desktop" "$log" | cat -A
            echo "::error::installing the .deb did not print how to start the app"
            exit 1
          fi
          test -x /usr/bin/rootmind-desktop
          test -f /usr/share/applications/RootMind.desktop
          expected=$(uv run --no-project --python 3.12 python -c "import sys; sys.path.insert(0, 'scripts'); from check_versions import normalize_version; print(normalize_version('$VERSION'))")
          printed=$(/usr/lib/RootMind/backend/rootmind-backend --version | awk '{print $NF}')
          if [ "$printed" != "$expected" ]; then
            echo "::error::the packaged backend says $printed, expected $expected"
            exit 1
          fi
          sudo apt-get remove -y -q root-mind
          cd "$RUNNER_TEMP"
          "$out/RootMind-x86_64.AppImage" --appimage-extract > /dev/null
          printed=$(squashfs-root/usr/lib/RootMind/backend/rootmind-backend --version | awk '{print $NF}')
          if [ "$printed" != "$expected" ]; then
            echo "::error::the AppImage's backend says $printed, expected $expected"
            exit 1
          fi
          echo "Packages: the .deb installs and both backends report $expected" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rootmind-linux-packages
          path: ${{ runner.temp }}/linux-packages/
          if-no-files-found: error
          retention-days: 30

  winget:
    name: winget manifests
    needs: [meta, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootmind-installer-windows-x64
          path: ${{ runner.temp }}/installer

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      # The publisher comes from tauri.conf.json, like the installer's own
      # entry. On a tag, the version must be spelled like the tag, since the
      # installer URL names it.
      - name: Render
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          sha=$(sha256sum "$RUNNER_TEMP/installer/RootMind-Setup-x64.exe" | cut -d ' ' -f 1)
          args=(--version "$VERSION" --sha256 "$sha" --out "$RUNNER_TEMP/winget")
          if [ "$REF_TYPE" = tag ]; then args+=(--tag "$REF_NAME"); fi
          python3 scripts/winget_manifests.py "${args[@]}" > "$RUNNER_TEMP/winget-schemas.tsv"

      - name: Validate against the vendored schemas
        run: |
          while IFS=$'\t' read -r manifest schema; do
            uvx --from check-jsonschema==0.38.2 check-jsonschema --schemafile "$schema" "$manifest"
          done < "$RUNNER_TEMP/winget-schemas.tsv"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: ${{ runner.temp }}/winget/
          if-no-files-found: error
          retention-days: 90

  mcpb:
    name: Claude Desktop bundle
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Bridge tests
        run: node --test "packaging/mcpb/test/*.test.mjs"

      # The meta job checked that the manifest carries the release version
      # (scripts/check_versions.py). Only manifest.json, icon.png and server/
      # go into the bundle.
      - name: Validate and pack
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          npx --yes "$MCPB_CLI" validate packaging/mcpb/manifest.json
          mkdir -p "$RUNNER_TEMP/mcpb"
          npx --yes "$MCPB_CLI" pack packaging/mcpb "$RUNNER_TEMP/mcpb/rootmind.mcpb"
          contents=$(unzip -Z1 "$RUNNER_TEMP/mcpb/rootmind.mcpb" | LC_ALL=C sort | tr '\n' ' ')
          expected="icon.png manifest.json server/bridge.mjs server/index.mjs "
          if [ "$contents" != "$expected" ]; then
            echo "::error::unexpected bundle contents: $contents"
            exit 1
          fi
          packed=$(unzip -p "$RUNNER_TEMP/mcpb/rootmind.mcpb" manifest.json | jq -r .version)
          if [ "$packed" != "$VERSION" ]; then
            echo "::error::the bundle has version $packed, expected $VERSION"
            exit 1
          fi
          sha=$(sha256sum "$RUNNER_TEMP/mcpb/rootmind.mcpb" | cut -d ' ' -f 1)
          size=$(stat -c %s "$RUNNER_TEMP/mcpb/rootmind.mcpb")
          echo "Claude Desktop bundle: rootmind.mcpb, $size bytes, SHA-256 $sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rootmind-mcpb
          path: ${{ runner.temp }}/mcpb/rootmind.mcpb
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the release
    needs: [meta, backend, installer, linux-packages, winget, mcpb]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that can write. Nothing it runs is built here: it packs
    # and publishes what the jobs above built and tested.
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # the Sigstore certificate for the attestations
      attestations: write # store the attestations
    steps:
      # For CHANGELOG.md and the scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootmind-installer-windows-x64
          path: ${{ runner.temp }}/assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootmind-backend-windows-x64
          path: ${{ runner.temp }}/backend/rootmind-backend

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootmind-mcpb
          path: ${{ runner.temp }}/assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootmind-linux-packages
          path: ${{ runner.temp }}/assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootmind-backend-linux-x64
          path: ${{ runner.temp }}/assets

      # The zip holds the folder rootmind-backend/ with exactly the tested
      # tree, files whose names start with a dot included. The Linux archive
      # (with the files' modes) comes from backend-exe.yml as it is, after the
      # same check. The bundle for Claude Desktop comes from the mcpb job, the
      # Linux packages from the linux-packages job.
      - name: Backend archives and checksums
        env:
          TREE_SHA256: ${{ needs.backend.outputs.tree-sha256 }}
          LINUX_TREE_SHA256: ${{ needs.backend.outputs.linux-tree-sha256 }}
        run: |
          hash=$(python3 scripts/prepare_backend.py --tree-hash "$RUNNER_TEMP/backend/rootmind-backend")
          if [ "$hash" != "$TREE_SHA256" ]; then
            echo "::error::backend tree hash $hash, expected $TREE_SHA256"
            exit 1
          fi
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$RUNNER_TEMP/linux-check"
          tar -xzf "$assets/rootmind-backend-linux-x64.tar.gz" -C "$RUNNER_TEMP/linux-check"
          hash=$(python3 scripts/prepare_backend.py --tree-hash "$RUNNER_TEMP/linux-check/rootmind-backend")
          if [ "$hash" != "$LINUX_TREE_SHA256" ]; then
            echo "::error::Linux backend tree hash $hash, expected $LINUX_TREE_SHA256"
            exit 1
          fi
          (
            cd "$RUNNER_TEMP/backend"
            find rootmind-backend -type f | LC_ALL=C sort | zip -X -q "$assets/rootmind-backend-windows-x64.zip" -@
          )
          cd "$assets"
          sha256sum RootMind-Setup-x64.exe RootMind-amd64.deb RootMind-x86_64.rpm RootMind-x86_64.AppImage \
            rootmind.mcpb rootmind-backend-windows-x64.zip rootmind-backend-linux-x64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/assets/RootMind-Setup-x64.exe
            ${{ runner.temp }}/assets/RootMind-amd64.deb
            ${{ runner.temp }}/assets/RootMind-x86_64.rpm
            ${{ runner.temp }}/assets/RootMind-x86_64.AppImage
            ${{ runner.temp }}/assets/rootmind.mcpb
            ${{ runner.temp }}/assets/rootmind-backend-windows-x64.zip
            ${{ runner.temp }}/assets/rootmind-backend-linux-x64.tar.gz
            ${{ runner.temp }}/assets/SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          assets="$RUNNER_TEMP/assets"
          python3 scripts/release_notes.py "$TAG" --installer "$assets/RootMind-Setup-x64.exe" > "$RUNNER_TEMP/notes.md"
          flags=(--verify-tag --title "RootMind $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "${flags[@]}" \
            "$assets/RootMind-Setup-x64.exe" \
            "$assets/RootMind-amd64.deb" \
            "$assets/RootMind-x86_64.rpm" \
            "$assets/RootMind-x86_64.AppImage" \
            "$assets/rootmind.mcpb" \
            "$assets/rootmind-backend-windows-x64.zip" \
            "$assets/rootmind-backend-linux-x64.tar.gz" \
            "$assets/SHA256SUMS.txt"

  mcp-registry:
    name: MCP Registry
    needs: [meta, mcpb, publish]
    # After "Publish the release", because the registry entry points at the
    # release's rootmind.mcpb. A run that publishes nothing (pull request,
    # manual run) skips the publish job; then this job renders and validates
    # server.json only. It does not decide whether the release succeeded:
    # when the registry fails, the GitHub release stays published and this
    # job can be re-run on its own (Re-run failed jobs).
    if: >-
      !cancelled() && needs.meta.result == 'success' && needs.mcpb.result == 'success'
      && (needs.publish.result == 'success'
      || (needs.publish.result == 'skipped' && !(github.event_name == 'push' && github.ref_type == 'tag')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with an OIDC token for the MCP Registry, which grants it
    # the namespace io.github.<repository owner>/*. It needs no stored secret
    # (an optional fallback secret is described at the publish step).
    permissions:
      contents: read # download the release's assets
      id-token: write # mcp-publisher login github-oidc
    env:
      # mcp-publisher from https://github.com/modelcontextprotocol/registry/releases.
      # The hash is the one for mcp-publisher_linux_amd64.tar.gz in that
      # release's registry_<version>_checksums.txt.
      MCP_PUBLISHER_VERSION: "1.8.4"
      MCP_PUBLISHER_SHA256: "5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628" # pragma: allowlist secret (a file hash)
      REGISTRY_URL: "https://registry.modelcontextprotocol.io"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Publish after a release, except for a prerelease: the registry has no
      # channel for prereleases, and clients install its newest version.
      - name: Mode
        id: mode
        env:
          RELEASED: ${{ needs.publish.result == 'success' }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          if [ "$RELEASED" != true ]; then
            publish=false
            echo "MCP Registry: dry run, server.json rendered from the built bundle and validated, nothing published" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PRERELEASE" = true ]; then
            publish=false
            echo "::notice::A prerelease is not published to the MCP Registry."
            echo "MCP Registry: prerelease, server.json rendered from the release and validated, not published" >> "$GITHUB_STEP_SUMMARY"
          else
            publish=true
          fi
          echo "released=$RELEASED" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootmind-mcpb
          path: ${{ runner.temp }}/mcpb

      # The hash must be the one of the file behind the entry's URL: MCP
      # clients refuse a bundle with another hash, and the registry does not
      # check it. After a release, the bundle and SHA256SUMS.txt come from the
      # release itself, and the bundle must be the one the mcpb job built.
      - name: Bundle from the release
        if: steps.mode.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern rootmind.mcpb --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/release"
          if ! cmp -s "$RUNNER_TEMP/release/rootmind.mcpb" "$RUNNER_TEMP/mcpb/rootmind.mcpb"; then
            echo "::error::the release's rootmind.mcpb differs from the one the mcpb job built"
            exit 1
          fi

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      # scripts/registry_server_json.py fills packaging/mcpb/server.json with
      # the version, the release URL and the bundle's SHA-256 (checked against
      # SHA256SUMS.txt after a release); then the entry is validated against
      # the vendored schema.
      - name: Render server.json
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          RELEASED: ${{ steps.mode.outputs.released }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$RELEASED" = true ]; then
            args=(--mcpb "$RUNNER_TEMP/release/rootmind.mcpb" --sums "$RUNNER_TEMP/release/SHA256SUMS.txt" --tag "$TAG")
          else
            args=(--mcpb "$RUNNER_TEMP/mcpb/rootmind.mcpb" --version "$VERSION")
          fi
          python3 scripts/registry_server_json.py "${args[@]}" --out "$RUNNER_TEMP/registry" > "$RUNNER_TEMP/registry-schema.tsv"
          IFS=$'\t' read -r entry schema < "$RUNNER_TEMP/registry-schema.tsv"
          uvx --from check-jsonschema==0.38.2 check-jsonschema --schemafile "$schema" "$entry"
          { echo "### server.json"; echo; echo '```json'; cat "$entry"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Pinned and checked against the hash above, instead of the docs'
      # download of releases/latest.
      - name: Install mcp-publisher
        run: |
          url="https://github.com/modelcontextprotocol/registry/releases/download/v$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/mcp-publisher.tar.gz" "$url"
          echo "$MCP_PUBLISHER_SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mcp-publisher"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP/mcp-publisher" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher/mcp-publisher" --version

      # The registry's own checks without a login (POST /v0/validate):
      # schema, name, version and package rules. Whether the URL exists is
      # only checked on publish.
      - name: Validate with the registry
        run: |
          "$RUNNER_TEMP/mcp-publisher/mcp-publisher" validate "$RUNNER_TEMP/registry/server.json"

      # The registry accepts a version once. A re-run that finds the version
      # with the same URL and hash has nothing to do. After a registry data
      # reset the name is unknown, and publishing creates it again. The login
      # is GitHub OIDC; only when that fails, the optional repository secret
      # MCP_GITHUB_TOKEN (a classic PAT of the owner with read:org and
      # read:user) is used instead. Without the secret nothing changes.
      - name: Publish to the MCP Registry
        if: steps.mode.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          MCP_GITHUB_TOKEN: ${{ secrets.MCP_GITHUB_TOKEN }}
        run: |
          entry="$RUNNER_TEMP/registry/server.json"
          published="$RUNNER_TEMP/registry/published.json"
          name=$(jq -r .name "$entry")
          url="$REGISTRY_URL/v0.1/servers/$(jq -rn --arg n "$name" '$n | @uri')/versions/$VERSION"
          status=$(curl -sS --retry 3 -o "$published" -w '%{http_code}' "$url")
          # shellcheck disable=SC2016 # $want is a jq variable
          same='.server.packages[0].identifier == $want[0].packages[0].identifier and .server.packages[0].fileSha256 == $want[0].packages[0].fileSha256'
          if [ "$status" = 200 ]; then
            if jq -e --slurpfile want "$entry" "$same" "$published" > /dev/null; then
              echo "::notice::$name $VERSION is already in the MCP Registry with this bundle."
              exit 0
            fi
            echo "::error::$name $VERSION is already in the MCP Registry with another URL or hash; a version cannot be published twice (CONTRIBUTING.md, Releasing)."
            jq . "$published"
            exit 1
          elif [ "$status" != 404 ]; then
            echo "::error::the MCP Registry answered HTTP $status for $url"
            exit 1
          fi
          publisher="$RUNNER_TEMP/mcp-publisher/mcp-publisher"
          if ! "$publisher" login github-oidc; then
            if [ -z "$MCP_GITHUB_TOKEN" ]; then
              echo "::error::mcp-publisher login github-oidc failed. Re-run this job, add the fallback secret MCP_GITHUB_TOKEN, or publish by hand (CONTRIBUTING.md, Releasing)."
              exit 1
            fi
            echo "::warning::mcp-publisher login github-oidc failed; logging in with the secret MCP_GITHUB_TOKEN."
            "$publisher" login github --token "$MCP_GITHUB_TOKEN"
          fi
          "$publisher" publish "$entry"
          "$publisher" logout

      # Read the entry back: the registry serves the version with the
      # release's URL and hash.
      - name: Check the registry entry
        if: steps.mode.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          entry="$RUNNER_TEMP/registry/server.json"
          published="$RUNNER_TEMP/registry/published.json"
          name=$(jq -r .name "$entry")
          url="$REGISTRY_URL/v0.1/servers/$(jq -rn --arg n "$name" '$n | @uri')/versions/$VERSION"
          curl -fsS --retry 3 -o "$published" "$url"
          # shellcheck disable=SC2016 # $want is a jq variable
          same='.server.version == $want[0].version and .server.packages[0].identifier == $want[0].packages[0].identifier and .server.packages[0].fileSha256 == $want[0].packages[0].fileSha256'
          if ! jq -e --slurpfile want "$entry" "$same" "$published" > /dev/null; then
            echo "::error::the MCP Registry serves another entry for $name $VERSION:"
            jq . "$published"
            exit 1
          fi
          echo "MCP Registry: $name $VERSION published with rootmind.mcpb SHA-256 $(jq -r '.packages[0].fileSha256' "$entry")" >> "$GITHUB_STEP_SUMMARY"
