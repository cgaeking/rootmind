name: desktop

on:
  push:
    branches: [main]
    # Version tags also build the unsigned installer. GitHub does not apply
    # the path filter below to tag pushes.
    tags: ["v*"]
    paths:
      - "desktop/**"
      # The opener scope test checks the capability against this file.
      - "backend/src/rootmind/indexer/parser.py"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "backend/src/rootmind/indexer/parser.py"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  check:
    name: Lint, build and test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json # pnpm version from "packageManager"

      # No pnpm store cache: a cold install takes seconds.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      # tauri build and tauri dev refuse to run when a Rust crate and its npm
      # package differ in major.minor, but only the tag-only installer job runs
      # tauri build. tauri info runs the same check yet still exits 0, so fail
      # on its message here to catch a mismatch in every PR.
      - name: Tauri crate/npm version alignment
        shell: bash
        run: |
          out=$(pnpm tauri info 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if grep -q "Found version mismatched Tauri packages" <<<"$out"; then
            echo "::error::Rust crates and @tauri-apps npm packages differ in major.minor (see tauri info above)."
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      # tsc + vite build. Must run before cargo: tauri::generate_context!()
      # embeds ../dist.
      - run: pnpm build

      # rustup is preinstalled on the runner.
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      # The Rust cache saves minutes on branch and PR builds. Tag builds skip
      # it (lookup only), so nothing that runs for a release restores a cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          lookup-only: ${{ github.ref_type == 'tag' }} # zizmor: ignore[cache-poisoning]

      - name: cargo fmt
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check --locked --all-targets
      - name: cargo clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --locked

  installer:
    # App-only NSIS installer: no backend exe, no code signing, no release.
    # The full installer (backend service included, experimental) uses
    # src-tauri/tauri.installer.conf.json and is built by hand; see
    # ARCHITECTURE.md#packaging.
    name: Installer (unsigned)
    needs: check
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches the app version
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$pkg" -ne $env:TAG -or "v$cargo" -ne $env:TAG) {
            throw "Tag $env:TAG does not match package.json ($pkg) and Cargo.toml ($cargo)"
          }

      # No dependency caches in this job, so a release build never restores
      # a cache written by another run.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - run: pnpm install --frozen-lockfile

      # Runs `pnpm build` first (beforeBuildCommand), then the release build
      # and the NSIS bundle.
      - run: pnpm tauri build --ci

      - name: Checksums
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          $lines = Get-ChildItem "$dir/*-setup.exe" | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          # LF line endings, so `sha256sum -c SHA256SUMS.txt` works on any OS.
          [IO.File]::WriteAllText((Join-Path $PWD "$dir/SHA256SUMS.txt"), ($lines -join "`n") + "`n")
          Get-Content "$dir/SHA256SUMS.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rootmind-desktop-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-windows-x64-unsigned
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
