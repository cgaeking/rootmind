name: desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      # The opener scope test checks the capability against this file.
      - "backend/src/rootmind/indexer/parser.py"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "backend/src/rootmind/indexer/parser.py"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  check:
    name: Lint, build and test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json # pnpm version from "packageManager"

      # No pnpm store cache: a cold install takes seconds.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      # tauri build and tauri dev refuse to run when a Rust crate and its npm
      # package differ in major.minor, but only release.yml runs tauri build.
      # tauri info runs the same check yet still exits 0, so fail on its
      # message here to catch a mismatch in every PR.
      - name: Tauri crate/npm version alignment
        shell: bash
        run: |
          out=$(pnpm tauri info 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if grep -q "Found version mismatched Tauri packages" <<<"$out"; then
            echo "::error::Rust crates and @tauri-apps npm packages differ in major.minor (see tauri info above)."
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      # vitest with happy-dom: no browser, no network, no Tauri.
      - run: pnpm test
      # tsc + vite build. Must run before cargo: tauri::generate_context!()
      # embeds ../dist.
      - run: pnpm build

      # rustup is preinstalled on the runner. The compiler is pinned, like
      # every other build input, and release.yml builds the installer with the
      # same version; raise both together.
      - name: Rust toolchain
        env:
          RUST_TOOLCHAIN: "1.96.0"
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component clippy,rustfmt
          rustup default $env:RUST_TOOLCHAIN

      # The Rust cache saves minutes on branch and PR builds. Release builds
      # (release.yml) use no cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target

      - name: cargo fmt
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check --locked --all-targets
      - name: cargo clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --locked
