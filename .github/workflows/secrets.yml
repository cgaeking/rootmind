name: secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret scan (detect-secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # Scans every tracked file. Known false positives are audited in
      # .secrets.baseline (is_secret: false). Exit code 1 means a new
      # potential secret; 3 only means line numbers in the baseline moved.
      - name: detect-secrets
        run: | # pragma: allowlist secret (the word "secrets" in the step, not a value)
          mapfile -d '' files < <(git ls-files -z)
          status=0
          uvx --from detect-secrets==1.5.0 detect-secrets-hook \
            --baseline .secrets.baseline "${files[@]}" || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi
