# Monthly dependency updates, at most one grouped pull request per ecosystem.
# Majors are in the group too; check the group's CI run before merging.
# GitHub's own security updates (for published advisories) come on top.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      backend:
        patterns: ["*"]

  # Tauri's npm packages must stay on the same major.minor as the Rust crates
  # (tauri <-> @tauri-apps/api, tauri-plugin-X <-> @tauri-apps/plugin-X), or
  # `tauri build` fails. desktop.yml fails on a mismatch (`pnpm tauri info`),
  # and release.yml dry-runs `tauri build` for PRs that change
  # pnpm-lock.yaml. Merge the npm and cargo PRs of a run together.
  # An update of @tauri-apps/cli also needs the NSIS template refreshed:
  # `python scripts/nsis_template.py --write`, committed to the same PR
  # (backend.yml's script tests fail until then).
  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "monthly"
    # pnpm rejects packages younger than its minimumReleaseAge (1 day), also
    # in CI's `pnpm install --frozen-lockfile`.
    cooldown:
      default-days: 3
    groups:
      desktop:
        patterns: ["*"]
    ignore:
      # TypeScript 7 has no JS API; typescript-eslint (peer < 6.1) refuses to
      # load with it. Remove once typescript-eslint supports TS 7.
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: "cargo"
    directory: "/desktop/src-tauri"
    schedule:
      interval: "monthly"
    # Same delay as npm, so both PRs of a run see the same Tauri releases.
    cooldown:
      default-days: 3
    groups:
      tauri-shell:
        patterns: ["*"]
