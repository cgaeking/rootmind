# The LangGraph baseline for the evals (#48), in its own environment so that the
# product (backend/pyproject.toml, uv.lock and the packaged backend) never
# depends on LangChain. Run it from backend/ with:
#
#   uv run --project evals/baselines/langgraph python scripts/run_evals.py \
#       --mode live --agent langgraph --provider ollama --model granite4.1:8b --runs 3
#
# Versions are pinned exactly so a result in evals/README.md can be reproduced.
[project]
name = "rootmind-langgraph-baseline"
version = "0.1.0"
description = "Eval baseline: RootMind's tools and system prompt in LangChain's stock LangGraph agent"
requires-python = ">=3.12"
dependencies = [
    # RootMind itself (editable), for the tools, the system prompt and the eval harness.
    "rootmind-backend",
    "langchain==1.4.7",
    "langchain-core==1.7.0",
    "langgraph==1.2.17",
    # OpenAI-compatible chat client: OpenAI, xAI and Ollama (its /v1 API), the
    # same endpoints RootMind's own loop calls.
    "langchain-openai==1.7.2",
    # Only for a hosted comparison with Claude models.
    "langchain-anthropic==1.7.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false
# Every package this environment shares with the backend at the version in
# backend/uv.lock, so RootMind's parsers, index and SDKs behave exactly as in the
# backend environment that runs RootMind's own loop. Regenerate after a backend
# lock change; tests/test_baseline_langgraph.py fails when the two drift.
constraint-dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anthropic==1.13.0",
    "anyio==4.15.1",
    "apscheduler==3.11.3",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "colorama==0.4.6",
    "cryptography==50.0.2",
    "docstring-parser==0.18.0",
    "et-xmlfile==2.0.0",
    "fastapi==0.143.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpcore2==2.13.1",
    "httptools==0.9.0",
    "httpx==0.28.1",
    "httpx2==2.13.1",
    "httpx2-jsfetch==1.0",
    "idna==3.20",
    "iniconfig==2.3.1",
    "jiter==0.17.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "lxml==6.1.3",
    "mcp==2.3.0",
    "mcp-types==2.3.0",
