# RootMind backend configuration.
# Copy this file to config.yaml (next to it, or into the folder named by RLM_HOME)
# and adjust it. config.yaml is gitignored: it can hold API keys.

# LLM provider used by POST /query (search and indexing need no LLM).
llm:
  provider: anthropic          # anthropic | openai | xai
  model: claude-sonnet-5-5
  # API keys: prefer the environment (ANTHROPIC_API_KEY, OPENAI_API_KEY,
  # XAI_API_KEY). Keys saved through the desktop app are stored here in
  # plain text under api_keys.<provider>.
  # api_keys:
  #   anthropic: ""
  # Timeout for each LLM call, in seconds.
  timeout_seconds: 120
  # OpenAI or xAI (Grok) instead: set provider and a model id from
  # POST /llm/models (or the desktop settings), e.g.
  # provider: xai
  # model: <grok model id>

# SQLite database with the full-text index. Relative paths resolve against
# RLM_HOME, or the working directory when RLM_HOME is unset.
database:
  path: ./data/index.db

# Folders to index. Add one entry per folder; names must be unique.
connectors:
  - name: demo
    type: local
    # Absolute or relative path, e.g. C:/Users/<you>/Documents or ~/Documents
    path: ./evals/corpus
    # For a mounted network share (CIFS/NFS), whose changes made on other
    # machines raise no event: re-scan this folder every N minutes.
    # rescan_minutes: 10

# Indexer settings
indexer:
  # Re-index interval in hours (takes precedence over sync_schedule when > 0).
  sync_interval_hours: 24
  # Alternative: cron schedule (minute hour day month weekday), used when
  # sync_interval_hours is 0.
  sync_schedule: "0 3 * * *"
  # Files larger than this are skipped (MB).
  max_file_size_mb: 50
  # File patterns for every folder (a connector can override them with its
  # own include/exclude lists). The include list is also the default.
  include:
    - "*.pdf"
    - "*.docx"
    - "*.xlsx"
    - "*.pptx"
    - "*.md"
    - "*.txt"
    - "*.csv"
  exclude:
    - ".*"            # hidden files and folders
    - "~$*"           # Office lock files
    - "node_modules"
    - "__pycache__"
    - "*.tmp"

# REST API bind address for `rootmind api` (--host/--port and RLM_HOST/RLM_PORT
# take precedence). Keep it on 127.0.0.1: without RLM_API_TOKEN or
# --require-token the REST API has no authentication, and it must never be
# exposed on a network. For remote agents, use the MCP HTTP server, which
# requires a bearer token.
api:
  host: 127.0.0.1
  port: 8000

# Remote access: a public HTTPS address for MCP over HTTP through ngrok, for
# assistants that run in the cloud. Only the RootMind service runs the tunnel
# (in its MCP over HTTP service); set it in the app under Settings → RootMind
# service. The ngrok authtoken is stored in data/ngrok_authtoken.txt, never in
# this file. Anyone with the MCP token can then read every indexed document.
remote_access:
  enabled: false
  domain: null        # a reserved ngrok domain such as name.ngrok-free.app

# MCP over HTTP for other machines (the RootMind service; see
# docs/SERVER.md). Off unless network.bind is set; the loopback listener on
# 127.0.0.1 that the app and remote access use is unchanged.
# mcp_http:
#   allowed_hosts: [rootmind.example.lan]   # Host names clients use (required)
#   allowed_origins: []                       # browser origins besides loopback
#   network:
#     bind: 0.0.0.0          # or 127.0.0.1 behind a reverse proxy on this machine
#     port: 3443
#     tls_cert: /home/rootmind/tls/fullchain.pem
#     tls_key: /home/rootmind/tls/privkey.pem
#     insecure_http: false   # plain HTTP on a non-loopback address: tokens unencrypted
#     allow_default_token: false   # data/api_token.txt sees every folder
#   # Named tokens are added by `rootmind mcp tokens create`, as SHA-256 only:
#   # tokens:
#   #   - {name: alice, sha256: <64 hex>, folders: [projects]}
