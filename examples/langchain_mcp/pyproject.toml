# Example: RootMind's MCP server as tools in a LangChain agent, via
# langchain-mcp-adapters. A separate environment: the example only talks to the
# server over stdio and does not import RootMind (langchain-mcp-adapters needs the
# MCP SDK 1.x, the backend uses 2.x). See README.md.
[project]
name = "rootmind-langchain-mcp-example"
version = "0.1.0"
description = "RootMind's MCP server as tools in a LangChain agent"
requires-python = ">=3.12"
dependencies = [
    "langchain==1.4.7",
    "langchain-core==1.7.0",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.7.2",
    "langgraph==1.2.17",
    "mcp==1.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false

[tool.ruff]
extend = "../../backend/pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101", "S603"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
