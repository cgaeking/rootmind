[package]
name = "rootmind-desktop"
version = "2.3.3"
description = "RootMind desktop app: chat and search over your local documents"
authors = ["Christian Gäking"]
license = "MIT"
repository = "https://github.com/cgaeking/rootmind"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "rootmind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One service change at a time, and the retries after a change (service.rs).
tokio = { version = "1.53", features = ["sync", "time"] }

# A second launch focuses the running window instead of opening a second one.
# The plugin has no JavaScript API.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5"

# Background service helpers (src/win/): service and registry queries, the TCP
# listener table, known folders, the process token and UAC elevation.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Services",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
# Same glob engine tauri uses for its path scopes (tests/opener_scope.rs).
glob = "0.3"
